# Generated by /init-project (.claude/scripts/write-ci-workflow.mjs). Safe to edit:
# the script only replaces this file when run with --force.
# Detected at the repo root: node.
# Projects in subfolders (monorepos) are not detected; add jobs for them by hand.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Codex skills registered and in sync with their Claude source
        run: node .claude/scripts/sync-codex-skills.mjs --check
